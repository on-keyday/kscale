# kscale PoP e2e harness.
#
# Phase 0 (this file): bring up the control plane + an l4lb and a popcache dataplane
# agent in privileged containers on one network, and verify both join the broker.
# l4lb runs the stub driver here; Phase 1 switches it to --driver l4lb (real XDP,
# needs privileged + bpffs + memlock=infinity, which the system docker provides).
#
# Run against the SYSTEM (rootful) docker so privileged containers get real init-ns
# caps + unlimited memlock:
#   ./build.sh
#   DOCKER_HOST=unix:///var/run/docker.sock docker compose -p kscale up --build -d
#   DOCKER_HOST=unix:///var/run/docker.sock docker compose -p kscale run --rm cli \
#       cli --addr 10.5.0.2:9443 --data /data --role admin --resource node --op list
name: kscale-pop

services:
  cp:
    build: .
    image: kscale-e2e
    # --demo: seed every role's bootstrap token into the shared /data volume so the
    # agents below can enroll. Production uses the root-issuer (admin token only).
    command: ["controlplane", "--port", "9443", "--data", "/data", "--demo"]
    volumes: ["shared:/data"]
    networks:
      pop:
        ipv4_address: 10.5.0.2

  # Metrics gateway: authenticated transport client that aggregates the CP + all
  # dataplane nodes' /metrics (over transport) onto one plain HTTP /metrics:9091
  # for prometheus. No plain metrics port on cp / the dp nodes.
  metricsgw:
    image: kscale-e2e
    command: ["metricsgw", "--addr", "10.5.0.2:9443", "--data", "/data",
              "--role", "admin", "--listen", ":9091"]
    volumes: ["shared:/data"]
    networks:
      pop:
        ipv4_address: 10.5.0.6
    depends_on: [cp]

  l4lb:
    image: kscale-e2e
    privileged: true
    command: ["dpagent", "--driver", "l4lb", "--auto-start=false",
              "--addr", "10.5.0.2:9443", "--data", "/data", "--node", "node1",
              "--file-dir", "/data/l4lb_files", "--ebpf-pin-dir", "/sys/fs/bpf",
              "--bin-path", "/objs/lb.o", "--crypto-bin", "/objs/init_crypto.o"]
    volumes: ["shared:/data", "/sys/fs/bpf:/sys/fs/bpf"]
    networks:
      pop:
        ipv4_address: 10.5.0.3
    depends_on: [cp]

  popcache:
    image: kscale-e2e
    privileged: true
    command: ["popcacheagent",
              "--addr", "10.5.0.2:9443", "--data", "/data", "--node", "node1",
              "--file-dir", "/data/popcache_files"]
    volumes: ["shared:/data"]
    networks:
      pop:
        ipv4_address: 10.5.0.4
    depends_on: [cp]

  # Stand-in for a host-network workload container on the popcache node (Phase 4):
  # shares popcache's netns exactly like a CRI sandbox with NamespaceMode_NODE shares
  # the node's, so VIP:8080 traffic that l4lb IPIP-forwards (every TCP port) and
  # popcache decaps onto the VIP-on-lo lands here. A tiny HTTP/1.0 responder on :8080.
  workload:
    image: kscale-e2e
    network_mode: "service:popcache"
    command:
      - sh
      - -c
      - |
        cat > /r.sh <<'EOF'
        #!/bin/sh
        printf 'HTTP/1.0 200 OK\r\nContent-Type: text/plain\r\n\r\nworkload-ok\n'
        EOF
        chmod +x /r.sh
        exec nc -lk -p 8080 -e /r.sh
    depends_on: [popcache]
    profiles: ["workload"]

  # Real workload node (Phase 5): containerd (CRI) + workloadagent, sharing popcache's
  # netns like the s1/s2 co-location. CRI sandboxes it creates with NamespaceMode_NODE
  # therefore land in that same netns, behind the VIP-on-lo. Built FROM kscale-e2e,
  # so bring the base image up first (phase5 does). Privileged for runc (namespaces,
  # cgroup v2 nesting, overlayfs mounts).
  workloadnode:
    build:
      context: .
      dockerfile: Dockerfile.workload
    image: kscale-e2e-workload
    privileged: true
    network_mode: "service:popcache"
    command: ["--addr", "10.5.0.2:9443", "--data", "/data", "--node", "node1",
              "--converge-interval", "5s"]
    volumes: ["shared:/data", "wlroot:/var/lib/containerd"]
    depends_on: [popcache]
    profiles: ["workload-cri"]

  # Built-in authoritative DNS dataplane (measure_stats_freshness.sh): serves
  # example.test on :53 so the client can drive its request counters.
  dns:
    image: kscale-e2e
    privileged: true
    command: ["dnsagent", "--backend", "builtin", "--domain", "example.test",
              "--dns-port", "53", "--auto-start",
              "--addr", "10.5.0.2:9443", "--data", "/data", "--node", "node1"]
    volumes: ["shared:/data"]
    networks:
      pop:
        ipv4_address: 10.5.0.7
    depends_on: [cp]
    profiles: ["dns"]

  # One-shot admin client (run with `docker compose run --rm cli ...`).
  cli:
    image: kscale-e2e
    command: ["true"]
    volumes: ["shared:/data"]
    networks: [pop]
    profiles: ["tools"]

  # Traffic client for the full-datapath test (Phase 3): privileged so it can add a
  # route to the VIP via the l4lb node. Stays up; the phase3 script execs into it.
  client:
    image: kscale-e2e
    privileged: true
    command: ["sleep", "infinity"]
    networks:
      pop:
        ipv4_address: 10.5.0.5
    profiles: ["datapath"]

volumes:
  shared:
  wlroot:

networks:
  pop:
    ipam:
      config:
        - subnet: 10.5.0.0/24
