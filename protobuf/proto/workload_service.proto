syntax = "proto3";

package ksdk.rpc;

option go_package = "github.com/on-keyday/kscale/protobuf/proto";

import "google/protobuf/empty.proto";

// WorkloadService is served BY the workload dp_type agent (like DataplaneService,
// the control plane is the acceptor and opens streams to the agent). The agent
// reconciles the desired container set to the node's container runtime over CRI
// (containerd). See notes/ai/2026_07_07_container_workload_cri_design.md.

// ContainerSpec is one desired container. Mirrors the `container` resource's
// fields (flat model: one spec is one container, wrapped in an implicit pod
// sandbox by the agent). env entries are "KEY=VALUE"; volume entries are
// "name:/containerPath" with an optional ":ro" suffix, name being an
// agent-managed directory under the node's volume root. mounts (raw
// "hostPath:containerPath") is rejected by the agent and kept for wire
// compatibility only.
message WorkloadServiceContainerSpec {
    string name = 1;
    string image = 2;
    repeated string command = 3;
    repeated string args = 4;
    repeated string env = 5;
    repeated string mounts = 6; // rejected: use volumes
    string restart = 7; // "always" | "never"
    string network = 8; // "" / "host" (node netns) | "pod" (own netns via the kscale CNI)
    repeated string ports = 9; // "tcp:8080"; only for network "pod"
    repeated string volumes = 10; // "name:/containerPath[:ro]"
}

// ApplyContainers hands the agent the FULL desired set for this node. The agent
// converges idempotently: (re)creates drifted/missing containers and removes
// managed containers no longer desired.
message WorkloadServiceApplyContainersRequest {
    repeated WorkloadServiceContainerSpec containers = 1;
}

// ContainerStatus is the observed state of one managed container. A desired
// container whose image is still being pulled in the background also gets an
// entry: with no container yet (container_id/state empty) or, when it replaces a
// running one, on that container's entry with pull_image naming the next image.
message WorkloadServiceContainerStatus {
    string name = 1;
    string container_id = 2;
    string image = 3;
    string state = 4; // CRI ContainerState: CREATED | RUNNING | EXITED | UNKNOWN; "" = no container yet
    string pod_sandbox_id = 5;
    string pull_state = 6; // "" (no pull pending) | "PULLING" | "FAILED"
    string pull_image = 7; // the image being pulled (set with pull_state)
    string pull_error = 8; // FAILED: the last attempt's error
    int64 pull_retry_at_unix_ms = 9; // FAILED: when the next attempt may start
}

message WorkloadServiceListContainersResponse {
    repeated WorkloadServiceContainerStatus containers = 1;
}

// SetNetdpObject selects the pod-network eBPF object by name in the node's file
// store (the workload_netdp_object resource).
message WorkloadServiceSetNetdpObjectRequest {
    string object = 1;
}

service WorkloadService {
    rpc ApplyContainers(WorkloadServiceApplyContainersRequest) returns (google.protobuf.Empty);
    rpc ListContainers(google.protobuf.Empty) returns (WorkloadServiceListContainersResponse);
    rpc SetNetdpObject(WorkloadServiceSetNetdpObjectRequest) returns (google.protobuf.Empty);
}
