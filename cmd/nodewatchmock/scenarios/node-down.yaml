  popcache_config_list:
    - result: |
        {
          "items": [
            {
              "name": "default",
              "origin": "https://origin.lab.on-keyday.net:8443",
              "http_port": 18080,
              "https_port": 18443,
              "http3_port": 18443,
              "wasm_compute_default_ms": 50,
              "wasm_compute_max_ms": 200,
