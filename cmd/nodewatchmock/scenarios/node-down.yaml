    - result: |
        {
          "stats": [
            {"common_name": "s1.popcache.dp.system.kscale.local", "dp_type": "popcache", "connection": {"conn_id": "conn-8f21aa", "rtt": 1350}, "host_realtime": {"load_avg": [0.31, 0.28, 0.25], "memory_usage": 3113851289}},
            {"common_name": "s3.l4lb.dp.system.kscale.local", "dp_type": "l4lb", "connection": {"conn_id": "conn-e044d7", "rtt": 1010}, "host_realtime": {"load_avg": [1.42, 1.38, 1.35], "memory_usage": 7381975040}},
            {"common_name": "s3.dns.dp.system.kscale.local", "dp_type": "dns", "connection": {"conn_id": "conn-77a3f0", "rtt": 980}},
            {"common_name": "s3.router.dp.system.kscale.local", "dp_type": "router", "connection": {"conn_id": "conn-b5d219", "rtt": 1050}},
            {"common_name": "s1.workload.dp.system.kscale.local", "dp_type": "workload", "connection": {"conn_id": "conn-3aa8c4", "rtt": 1310}}
          ]
        }
  vip_list:
    - result: |
        {
          "items": [
            {"vip": "10.3.10.100", "icmp_echo": true, "applied_on": ["s3.l4lb.dp.system.kscale.local"]}
          ]
        }
  interface_list:
    - result: |
        {
          "items": [
            {"node": "s1.popcache.dp.system.kscale.local", "interface": "ens19", "applied_on": ["s1.popcache.dp.system.kscale.local"]},
            {"node": "s2.popcache.dp.system.kscale.local", "interface": "ens19", "applied_on": ["s2.popcache.dp.system.kscale.local"]}
          ]
