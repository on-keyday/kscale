        error: dns-config "" not found
  container_list:
    - result: |
        {
          "items": [
            {"name": "hello-web", "node": "s1.workload.dp.system.kscale.local", "image": "docker.io/library/nginx:1.27", "env": ["LOG_LEVEL=info"], "restart": "always"}
          ]
        }
  container_diff:
    - result: |
        {}
  wasm_list:
    - result: |
        {
          "items": [
            {"module_id": 1, "file_path": "/var/lib/kscale-popcache/wasm/edge_app.wasm", "method": "GET", "path": "/hello", "match_type": "prefix", "compute_budget_ms": 50}
          ]
