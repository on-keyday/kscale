# Anomaly: s2 (popcache) has dropped off the control plane — no live connection, no
# stats reported. The edge stays reachable externally because s1 still serves.
# Everything else matches the healthy baseline.
#
# Since the expected_node advisory inventory (2026-07-18), node_list keeps a row for
# the declared-but-unconnected s2 with app_status "NotConnected" (deploy declares
# the inventory from the Ansible placement groups). The expected judgement: spot the
# NotConnected row and report s2 down/never-enrolled (warning) — not "edge down".
# (Before the ledger this scenario was hard mode: the vanished node was only
# inferable from the interface_list desired-state cross-reference.)
name: node-down
description: s2 popcache disconnected; edge still up via s1
tools:
  node_list:
    - result: |
        {
          "items": [
            {"common_name": "s1.popcache.dp.system.kscale.local", "dp_type": "popcache", "connection_id": "conn-8f21aa", "remote_address": "10.3.10.2:39441", "app_status": "Running"},
            {"common_name": "s3.l4lb.dp.system.kscale.local", "dp_type": "l4lb", "connection_id": "conn-e044d7", "remote_address": "10.3.10.4:52801", "app_status": "Running"},
            {"common_name": "s3.dns.dp.system.kscale.local", "dp_type": "dns", "connection_id": "conn-77a3f0", "remote_address": "10.3.10.4:58122", "app_status": "Running"},
            {"common_name": "s3.router.dp.system.kscale.local", "dp_type": "router", "connection_id": "conn-b5d219", "remote_address": "10.3.10.4:41977", "app_status": "Running"},
            {"common_name": "s1.workload.dp.system.kscale.local", "dp_type": "workload", "connection_id": "conn-3aa8c4", "remote_address": "10.3.10.2:36514", "app_status": "Running"},
            {"common_name": "s2.popcache.dp.system.kscale.local", "dp_type": "popcache", "app_status": "NotConnected"}
          ]
        }
  connection_list:
    - result: |
        {
          "items": [
            {"connection_id": "conn-8f21aa", "remote_address": "10.3.10.2:39441", "common_name": "s1.popcache.dp.system.kscale.local", "age": "26h12m", "active": true},
            {"connection_id": "conn-e044d7", "remote_address": "10.3.10.4:52801", "common_name": "s3.l4lb.dp.system.kscale.local", "age": "26h12m", "active": true},
            {"connection_id": "conn-77a3f0", "remote_address": "10.3.10.4:58122", "common_name": "s3.dns.dp.system.kscale.local", "age": "26h10m", "active": true},
            {"connection_id": "conn-b5d219", "remote_address": "10.3.10.4:41977", "common_name": "s3.router.dp.system.kscale.local", "age": "26h12m", "active": true},
            {"connection_id": "conn-3aa8c4", "remote_address": "10.3.10.2:36514", "common_name": "s1.workload.dp.system.kscale.local", "age": "25h58m", "active": true}
          ]
        }
  stats_get:
    - when: {common_name: s1.popcache}
      result: |
        {
          "stats": [
            {
              "common_name": "s1.popcache.dp.system.kscale.local",
              "dp_type": "popcache",
              "connection": {"conn_id": "conn-8f21aa", "rtt": 1350},
              "host_realtime": {"cpu_usages": [0.11, 0.09, 0.14, 0.08], "memory_usage": 3113851289, "disk_usage": 21474836480, "host_uptime": 1123200, "server_uptime": 94320, "load_avg": [0.31, 0.28, 0.25]},
              "popcache": {"requests_total": 48211, "cache_hits_total": 39102, "cache_misses_total": 9109, "per_method_total_get": 47010, "http_port": 18080, "https_port": 18443, "http3_port": 18443}
            }
          ]
        }
    - when: {common_name: s2.popcache}
      result: |
        {}
    - when: {common_name: s3.dns}
      result: |
        {
          "stats": [
            {
              "common_name": "s3.dns.dp.system.kscale.local",
              "dp_type": "dns",
              "connection": {"conn_id": "conn-77a3f0", "rtt": 980},
              "host_realtime": {"cpu_usages": [0.22, 0.19, 0.25, 0.18, 0.2, 0.21, 0.17, 0.23, 0.19, 0.2, 0.22, 0.18], "memory_usage": 7381975040, "disk_usage": 40265318400, "host_uptime": 1123300, "server_uptime": 94400, "load_avg": [1.42, 1.38, 1.35]},
              "dns": {"dns_port": 15353, "requests_total": 8102, "responses_total": 8100, "errors_total": 2}
            }
          ]
        }
    - when: {common_name: s3.l4lb}
      result: |
        {
          "stats": [
            {
              "common_name": "s3.l4lb.dp.system.kscale.local",
