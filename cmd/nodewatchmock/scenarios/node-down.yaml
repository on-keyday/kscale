          ]
        }
  dns_config_get:
    - when: {name: primary}
      result: |
        {"name": "primary", "port": 15353, "domain": "lab.on-keyday.net", "mail": "hostmaster.lab.on-keyday.net", "api_token": "cf-****", "api_zone_id": "zone-3f9a**"}
