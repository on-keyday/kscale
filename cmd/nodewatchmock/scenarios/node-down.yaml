probes:
  probe_dns:
    - when: {name: cdn.lab.on-keyday.net}
      result: |
        DNS A cdn.lab.on-keyday.net
          203.0.113.47 (ttl 300)
    - result: |
        DNS lookup
          no such host
  probe_http:
    - when: {url: "18443"}
      result: |
        HTTP GET https://cdn.lab.on-keyday.net:18443/hello
          status: 200 OK (HTTP/2.0, 96ms)
          server: kscale-popcache
          x-wasm-module: edge_app
          content-length: 13
    - when: {url: "18080"}
      result: |
        HTTP GET http://cdn.lab.on-keyday.net:18080/hello
          status: 200 OK (HTTP/1.1, 88ms)
          server: kscale-popcache
          x-wasm-module: edge_app
          content-length: 13
    - result: |
        HTTP GET
          request failed: dial tcp 203.0.113.47: connect: connection refused
  probe_tls:
    - when: {port: "18443"}
      result: |
        TLS cdn.lab.on-keyday.net:18443 (sni cdn.lab.on-keyday.net)
          negotiated: TLS 1.3, alpn h2
          leaf: CN=cdn.lab.on-keyday.net, issuer CN=kscale.local root, valid 2026-06-20 → 2026-09-18
          system trust: NOT trusted (private CA)
    - result: |
        TLS cdn.lab.on-keyday.net:443 (sni cdn.lab.on-keyday.net)
          connect failed: dial tcp 203.0.113.47:443: connect: connection refused
  probe_quic:
    - when: {port: "18443"}
      result: |
        QUIC/HTTP3 cdn.lab.on-keyday.net:18443 (sni cdn.lab.on-keyday.net)
          h3 reachable: status 200 OK (QUICv1, 104ms)
    - result: |
        QUIC/HTTP3 cdn.lab.on-keyday.net:443 (sni cdn.lab.on-keyday.net)
          handshake/request failed: timeout: no recent network activity
  probe_tcp:
    - when: {port: "18443"}
      result: |
        TCP cdn.lab.on-keyday.net:18443
          connect ok in 42ms
    - when: {port: "18080"}
      result: |
        TCP cdn.lab.on-keyday.net:18080
          connect ok in 40ms
    - result: |
        TCP cdn.lab.on-keyday.net
          connect failed: connection refused
  probe_ping:
    - result: |
        PING cdn.lab.on-keyday.net (203.0.113.47)
          5 packets transmitted, 5 received, 0% loss, rtt min/avg/max = 38.1/41.7/47.2 ms
  probe_traceroute:
    - result: |
        traceroute to cdn.lab.on-keyday.net (203.0.113.47), 12 hops
          1 192.168.0.1 1.1ms
          2 100.64.12.1 8.3ms
          ...
          11 203.0.113.1 37.9ms
          12 203.0.113.47 41.2ms
