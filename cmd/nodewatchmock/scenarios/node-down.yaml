  open_port_list:
    - result: |
        {
          "items": [
            {"acl_name": "kscale-dp", "ports": ["9443/udp", "18080/tcp", "18443/tcp", "18443/udp", "15353/udp", "icmp:echo"]}
          ]
        }
  open_port_diff:
