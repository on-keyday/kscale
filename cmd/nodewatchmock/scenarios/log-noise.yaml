# Log-heavy variant of healthy: fleet state and probes are identical (all up, no
# drift), but the scenario carries a per-node log corpus and therefore exposes the
# mock-only logs_tail tool. Two needles are buried in ~280 mostly-benign lines:
#   A. s1.popcache: a burst of TLS handshake errors from one client
#      (remote=203.0.113.199, err="bad certificate") between ~19m and ~14m ago.
#   B. s2.popcache: "wasm compute budget exceeded" (module 1, /hello) recurring
#      every ~10 minutes over the last 2 hours.
# Expected judgement: fleet healthy overall, but both log anomalies surfaced. Also
# probes whether the model narrows with filters (node/level/contains) instead of
# re-dumping into the 4000B tool-result truncation.
name: log-noise
description: healthy fleet, but a noisy log corpus with two buried anomalies (logs_tail)
